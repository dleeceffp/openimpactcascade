<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Questionnaire Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f8f9fa; }
        h1 { color: #0056b3; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select, input[type="text"] { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .loading { display: none; text-align: center; margin-top: 20px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Risk Questionnaire Generator</h1>
        <form id="generator-form">
            <div>
                <label for="industry">Industry:</label>
                <select id="industry" name="industry" required>
                    <option value="" disabled selected>Select an industry</option>
                    {% for industry in industries %}
                        <option value="{{ industry }}">{{ industry }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="region">Region/Country:</label>
                <select id="region" name="region" required>
                    <option value="" disabled selected>Select a region</option>
                    {% for region in regions %}
                        <option value="{{ region }}">{{ region }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="organization_size">Organization Size (Optional):</label>
                <input type="text" id="organization_size" name="organization_size" placeholder="e.g., '500 employees'">
            </div>
            <button type="submit">Generate Questionnaire</button>
        </form>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Generating... This may take up to 30 seconds.</p>
        </div>
    </div>

    <script>
        document.getElementById('generator-form').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('loading').style.display = 'block';

            const formData = new FormData(this);
            
            fetch('/generate', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.details || 'Failed to generate file.'); });
                }
                const header = response.headers.get('Content-Disposition');
                const parts = header.split(';');
                const filename = parts[1].split('=')[1];
                return response.blob().then(blob => ({ blob, filename }));
            })
            .then(({ blob, filename }) => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.getElementById('loading').style.display = 'none';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred: ' + error.message);
                document.getElementById('loading').style.display = 'none';
            });
        });
    </script>
</body>
</html>
