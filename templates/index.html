<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenImpactCascade - Risk Analysis</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>OpenImpactCascade</h1>
        <p>Quantitative Risk Analysis</p>
    </header>

    <main>
        <h2>Risk Analysis Questionnaire</h2>
        <form id="analysis-form" action="/analyze" method="post">
            <div id="questionnaire-container">
                <!-- Questions will be dynamically inserted here by questionnaire.js -->
            </div>

            <div class="static-input">
                <h3>Simulation Settings</h3>
                <div class="input-group">
                    <label for="n_simulations">Number of Simulations:</label>
                    <input type="number" id="n_simulations" name="n_simulations" value="10000" min="1000" max="100000" required>
                </div>
            </div>
            <button type="submit" id="submit-btn" style="display:none;">Analyze Risk</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 OpenImpactCascade</p>
    </footer>

    <script id="questions-data" type="application/json">
        {{ questions | tojson | safe }}
    </script>
    <script src="/static/questionnaire.js"></script>
</body>
</html>
