<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ card.label }} - Cascade Archetype</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f7fafc;
            color: #2d3142;
            line-height: 1.6;
            padding: 0 0 60px;
        }
        .topbar {
            background: #e2e8f0;
            color: #2d3748;
            padding: 20px 24px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        }
        .topbar .inner {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .topbar h1 { font-size: 1.3em; }
        .topbar .meta { font-size: 0.85em; opacity: 0.9; margin-top: 4px; }
        .domain-badge {
            display: inline-block;
            background: rgba(255,255,255,0.22);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            letter-spacing: 0.05em;
            margin-left: 8px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            color: #5a3d8a;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9em;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
        .content {
            max-width: 860px;
            margin: 30px auto 0;
            background: #fff;
            border-radius: 12px;
            padding: 36px 44px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .content h1, .content h2, .content h3 { color: #4a3a7a; margin: 1.2em 0 0.5em; }
        .content h1 { font-size: 1.6em; }
        .content h2 { font-size: 1.3em; border-bottom: 2px solid #eee; padding-bottom: 6px; }
        .content h3 { font-size: 1.1em; }
        .content p { margin: 0.6em 0; }
        .content ul, .content ol { margin: 0.6em 0 0.6em 1.4em; }
        .content li { margin: 0.3em 0; }
        .content code {
            background: #f0eef8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .content pre {
            background: #2d3142;
            color: #f4f5fa;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }
        .content table { border-collapse: collapse; margin: 1em 0; width: 100%; }
        .content th, .content td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; }
        .content th { background: #f0eef8; }
        .content blockquote {
            border-left: 4px solid #667eea;
            margin: 1em 0;
            padding: 4px 16px;
            background: #f8f7fc;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="inner">
            <div>
                <h1>{{ card.label }}{% if card.domain %}<span class="domain-badge">{{ card.domain|upper }}</span>{% endif %}</h1>
                <div class="meta">Cascade archetype <code style="background:rgba(255,255,255,0.2);color:#fff;">{{ card.id }}</code></div>
            </div>
            <button class="back-btn" onclick="goBack()">&larr; Back to selection</button>
        </div>
    </div>

    <div class="content">
        {{ body_html | safe }}
    </div>

    <script>
        function goBack() {
            // If opened in a new tab, just close it; otherwise navigate back.
            if (window.opener && !window.opener.closed) {
                window.close();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "{{ url_for('generate') }}";
            }
        }
    </script>
</body>
</html>
