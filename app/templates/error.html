<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - OpenImpactCascade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f7fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .error-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #e53e3e;
            margin-bottom: 20px;
        }
        
        .error-message {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 20px;
            background: #fff5f5;
            border-left: 4px solid #e53e3e;
            border-radius: 4px;
            text-align: left;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #4a5568;
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 30px 20px;
            border-top: 1px solid #e2e8f0;
        }

        .footer-brand {
            font-size: 1.1em;
            font-weight: 600;
            color: #243b53;
            margin-bottom: 8px;
        }

        .footer-tagline {
            font-size: 0.9em;
            color: #627d98;
            margin-bottom: 15px;
        }

        .footer-link {
            color: #2563eb;
            text-decoration: none;
            font-size: 0.9em;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        .footer-copyright {
            font-size: 0.85em;
            color: #a0aec0;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">⚠️</div>
        <h1>Oops! Something went wrong</h1>
        
        <div class="error-message">
            {{ error }}
        </div>
        
        <div class="button-group">
            <a href="javascript:history.back()" class="btn btn-secondary">← Go Back</a>
            <a href="{{ url_for('home') }}" class="btn btn-primary">Return Home</a>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-tagline">Beta release · Evidence-informed cyber-risk analysis</div>
        <div class="footer-copyright">OpenImpactCascade is licensed under the Apache License, Version 2.0.</div>
        <div class="footer-copyright">© 2026 FirstFire Productions. <a href="https://impactcascade.ca" class="footer-link" target="_blank">https://impactcascade.ca</a></div>
    </footer>
</body>
</html>
