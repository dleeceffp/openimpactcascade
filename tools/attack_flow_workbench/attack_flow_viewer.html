<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Attack Flow Viewer (STIX → Mermaid)</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171c24; --border: #2a313c; --text: #e6e9ee;
    --muted: #8b95a3; --accent: #4a7fb5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
           display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  button, label.filebtn {
    background: var(--accent); color: #fff; border: none; padding: 7px 14px;
    border-radius: 6px; font-size: 13px; cursor: pointer; }
  button.secondary { background: #2a313c; }
  label.filebtn input { display: none; }
  #meta { padding: 8px 16px; font-size: 12px; color: var(--muted); background: var(--panel);
          border-bottom: 1px solid var(--border); display: none; }
  #meta b { color: var(--text); }
  #stage { flex: 1; overflow: auto; padding: 24px; }
  #diagram { display: flex; justify-content: center; }
  #diagram svg { max-width: none !important; height: auto; }
  #empty { color: var(--muted); text-align: center; margin-top: 12%; line-height: 1.7; }
  #empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }
  .err { color: #e06c75; background: #2a1416; border: 1px solid #5a2a2e;
         padding: 12px 16px; border-radius: 6px; margin: 16px; white-space: pre-wrap; font-size: 13px; }
  .warn { color: #d9a441; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Attack Flow Viewer</h1>
  <span class="warn" id="assetwarn"></span>
  <span class="spacer"></span>
  <label class="filebtn">Open STIX bundle (.json)
    <input type="file" id="file" accept=".json,application/json" />
  </label>
  <button class="secondary" id="copybtn">Copy Mermaid</button>
  <button class="secondary" id="svgbtn">Download SVG</button>
</header>
<div id="meta"></div>
<div id="stage">
  <div id="empty">
    Open a STIX 2.1 Attack Flow bundle to render it.<br />
    Produced by <code>afb_to_stix.py</code> or any Attack Flow STIX export.<br />
    The diagram shows the action chain with branches; assets appear as parallelograms.
  </div>
  <div id="diagram"></div>
</div>

<!-- Mermaid from CDN. If you need fully offline, download mermaid.min.js and point the src at the local copy. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose',
                       flowchart: { useMaxWidth: false, htmlLabels: true, nodeSpacing: 40, rankSpacing: 55 } });

  const $ = (id) => document.getElementById(id);
  let lastMermaid = '';

  function short(sid) {
    const p = sid.split('--');
    return 'n' + (p[1] || sid).replace(/-/g, '').slice(0, 10);
  }
  function esc(s) {
    return (s || '').toString().replace(/"/g, '&quot;').replace(/\n/g, ' ').replace(/[<>]/g, '');
  }
  function confLabel(c) {
    if (c === null || c === undefined) return '';
    const map = { 100:'certain', 90:'very-probable', 75:'probable', 50:'even-odds',
                  30:'doubtful', 10:'very-doubtful', 0:'speculative' };
    return map[c] !== undefined ? map[c] : ('conf ' + c);
  }

  function stixToMermaid(bundle) {
    const objs = bundle.objects || [];
    const actions = {}, assets = {}, conditions = {}, operators = {};
    let flow = null;
    for (const o of objs) {
      if (o.type === 'attack-action') actions[o.id] = o;
      else if (o.type === 'attack-asset') assets[o.id] = o;
      else if (o.type === 'attack-condition') conditions[o.id] = o;
      else if (o.type === 'attack-operator') operators[o.id] = o;
      else if (o.type === 'attack-flow') flow = o;
    }
    const lines = ['flowchart TD'];

    for (const [id, a] of Object.entries(actions)) {
      const tid = a.technique_id ? a.technique_id : '';
      const c = confLabel(a.confidence);
      const sub = (tid || c) ? `<br/><small>${esc(tid)}${tid && c ? ' · ' : ''}${esc(c)}</small>` : '';
      lines.push(`  ${short(id)}["<b>${esc(a.name)}</b>${sub}"]`);
    }
    for (const [id, a] of Object.entries(assets))
      lines.push(`  ${short(id)}[/"${esc(a.name)}"/]`);
    for (const [id, c] of Object.entries(conditions))
      lines.push(`  ${short(id)}{"${esc(c.description || c.name || 'condition')}"}`);
    for (const [id, op] of Object.entries(operators))
      lines.push(`  ${short(id)}(("${esc(op.operator || 'AND')}"))`);

    const linkable = { ...actions, ...assets, ...conditions, ...operators };
    const pushEdge = (from, to, label) => {
      if (!linkable[to]) return;
      lines.push(label ? `  ${short(from)} -->|${esc(label)}| ${short(to)}`
                       : `  ${short(from)} --> ${short(to)}`);
    };
    for (const [id, a] of Object.entries(actions)) {
      (a.effect_refs || []).forEach(e => pushEdge(id, e));
      (a.asset_refs || []).forEach(e => pushEdge(id, e, 'targets'));
    }
    for (const [id, c] of Object.entries(conditions)) {
      (c.on_true_refs || []).forEach(e => pushEdge(id, e, 'true'));
      (c.on_false_refs || []).forEach(e => pushEdge(id, e, 'false'));
    }
    for (const [id, op] of Object.entries(operators))
      (op.effect_refs || []).forEach(e => pushEdge(id, e));

    const cls = (ids, name) => { if (ids.length) lines.push(`  class ${ids.map(short).join(',')} ${name};`); };
    lines.push('  classDef action fill:#1f3a5f,stroke:#4a7fb5,color:#fff;');
    lines.push('  classDef asset fill:#c8651b,stroke:#e8893b,color:#fff;');
    lines.push('  classDef cond fill:#3a2f5f,stroke:#7b5fb5,color:#fff;');
    lines.push('  classDef op fill:#3f3f3f,stroke:#888,color:#fff;');
    cls(Object.keys(actions), 'action');
    cls(Object.keys(assets), 'asset');
    cls(Object.keys(conditions), 'cond');
    cls(Object.keys(operators), 'op');

    // diagnostics
    const connectedAssets = new Set();
    for (const a of Object.values(actions)) (a.asset_refs || []).forEach(e => connectedAssets.add(e));
    const orphanAssets = Object.keys(assets).filter(a => !connectedAssets.has(a));

    return {
      mermaid: lines.join('\n'),
      meta: {
        name: flow ? flow.name : '(unnamed flow)',
        scope: flow ? flow.scope : '',
        actions: Object.keys(actions).length,
        assets: Object.keys(assets).length,
        edges: Object.values(actions).reduce((s, a) => s + (a.effect_refs || []).length, 0),
        orphanAssets: orphanAssets.length
      }
    };
  }

  async function render(bundle) {
    $('empty').style.display = 'none';
    let out;
    try { out = stixToMermaid(bundle); }
    catch (e) { showError('Could not parse STIX bundle: ' + e.message); return; }
    lastMermaid = out.mermaid;

    $('meta').style.display = 'block';
    $('meta').innerHTML = `<b>${esc(out.meta.name)}</b> &nbsp;·&nbsp; scope: ${esc(out.meta.scope)}` +
      ` &nbsp;·&nbsp; ${out.meta.actions} actions, ${out.meta.edges} edges, ${out.meta.assets} assets`;
    $('assetwarn').textContent = out.meta.orphanAssets
      ? `⚠ ${out.meta.orphanAssets} asset(s) not linked to any action (generator did not emit asset_refs)`
      : '';

    try {
      const { svg } = await mermaid.render('graph_' + Date.now(), out.mermaid);
      $('diagram').innerHTML = svg;
    } catch (e) {
      showError('Mermaid render error: ' + e.message + '\n\n--- generated mermaid ---\n' + out.mermaid);
    }
  }

  function showError(msg) {
    $('diagram').innerHTML = '';
    const d = document.createElement('div');
    d.className = 'err'; d.textContent = msg;
    $('diagram').appendChild(d);
  }

  $('file').addEventListener('change', (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { render(JSON.parse(r.result)); }
      catch (e) { showError('Invalid JSON: ' + e.message); }
    };
    r.readAsText(f);
  });

  $('copybtn').addEventListener('click', () => {
    if (!lastMermaid) return;
    navigator.clipboard.writeText(lastMermaid);
    $('copybtn').textContent = 'Copied!';
    setTimeout(() => $('copybtn').textContent = 'Copy Mermaid', 1200);
  });

  $('svgbtn').addEventListener('click', () => {
    const svg = $('diagram').querySelector('svg');
    if (!svg) return;
    const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'attack_flow.svg'; a.click();
  });
</script>
</body>
</html>
