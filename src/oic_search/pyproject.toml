[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oic-search"
version = "0.1.0"
description = "Shared pluggable search/grounding module for OIC applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OIC", email = "oic@example.com"},
]
keywords = ["search", "grounding", "google-cse", "brave", "tavily", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# requests is the only mandatory runtime dep — no search SDK is required
# because all three provider SDKs are either HTTP-based (Brave, Tavily) or
# use the Google API directly via requests (Google CSE).
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
# TOML config file support on Python < 3.11 (3.11+ has tomllib in stdlib)
toml = [
    "tomli>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/oic/oic-search"
Repository = "https://github.com/oic/oic-search"

[tool.setuptools.packages.find]
where = ["."]
include = ["oic_search*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
