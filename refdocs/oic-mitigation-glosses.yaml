# OIC mitigation gloss table
# Source: MITRE ATT&CK STIX — enterprise-attack-19.1 / ics-attack-19.1 (verbatim ids + names).
# Generated: 2026-06-04.
# Glosses authored against MITRE mitigation descriptions for the OIC cascade-card pipeline.
#
# Per mitigation:
#   name:                  MITRE mitigation name (verbatim — join key to ATT&CK 'mitigates' relationships)
#   control:               plain-language control phrasing — used in the card's mitigations section
#   weakness_when_absent:  the gap the gate prose names when this control is missing or weak
#   preventable: false     present only on the two "do not / cannot mitigate" entries; route these
#                          to a detection/response note rather than listing them as an option
#
# Counts: enterprise 44, ics 52.
schema_version: "1.0"
attack_version: "enterprise-attack-19.1 / ics-attack-19.1"
generated: "2026-06-04"

enterprise:
  M1013:
    name: "Application Developer Guidance"
    control: "secure-coding guidance and training for developers"
    weakness_when_absent: "software is built without secure-design practices, leaving exploitable flaws in the product"
  M1015:
    name: "Active Directory Configuration"
    control: "hardened Active Directory group-policy and trust configuration"
    weakness_when_absent: "AD is left in a permissive default state, so accounts, logon policy, and trusts can be abused"
  M1016:
    name: "Vulnerability Scanning"
    control: "regular vulnerability scanning with prioritized remediation"
