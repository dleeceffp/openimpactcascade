# =============================================================================
# OIC financial pillar — AI-extracted test file
# IBM Cost of a Data Breach 2025 (industry series)
# Extracted by Windsurf AI from source PDF using pdfplumber coordinate analysis.
# Figure 3 values read from word-coordinate proximity to industry labels (page 7).
# Prior-year (2024) values read from same figure for trend validation.
# =============================================================================

publisher:          "IBM Cost of a Data Breach"
edition:            "2025"
published:          "2025-07"
citation_url:       "https://www.ibm.com/reports/data-breach"
evidence_type:      incurred_loss          # benchmark of realized breach costs (not claims, not survey)
unit:               "USD millions, average total breach cost"
basis_default:      avg                    # report uses activity-based average cost (no medians by industry)
banding:            none                   # IBM segments by INDUSTRY and COUNTRY, not org size
comparable_series:  "ibm-cost-by-industry" # trend only against other IBM editions of THIS series
review_status:      "[AI-EXTRACTED]"       # extracted by AI from source PDF — verify figures against original

# Why banding is `none`:
#   This report does not break costs out by organization size (headcount or revenue).
#   There is therefore no size band to map onto OIC's headcount bands. Do NOT invent one.
#   For size-scaled magnitude, pair this with NetDiligence (claims, revenue-banded).

# Extraction method note:
#   Figure 3 (industry bar chart) is a graphic — values were not directly in the PDF text stream.
#   Extracted via pdfplumber word-coordinate analysis: numeric tokens were matched to industry
#   label positions by proximity on page 7. 2025 values appear immediately right of each label;
#   2024 values appear on the next line at a slightly lower y-coordinate. All 17 industries
#   and both years are confirmed present. Figures cross-checked against narrative text:
#   - "Healthcare remained the costliest industry for the 14th consecutive year" -> 7.42 ✓
#   - "global average fell to USD 4.44 million" -> global_average confirmed ✓
#   - "US bucked the trend at a record 10.22" -> region data confirmed ✓

methodology_note: >
  Ponemon/IBM benchmark of 600 organizations across 16 countries/regions and 17 industries,
  for breaches occurring Mar 2024–Feb 2025. Costs are AVERAGE total cost via activity-based
  costing, in USD millions; FX as of 1 Mar 2025 (Federal Reserve rates). Breach sizes ranged
  2,960–113,620 records (very small and very large breaches excluded), so figures reflect
  mid-size breaches, NOT an SME-scaled cost. The sample is NONSTATISTICAL (no margins of
  error / confidence intervals) and is described by the authors as biased toward organizations
  with more mature security programs. Per-record cost cannot be extrapolated to large breaches.
  Each annual edition is a DIFFERENT sample matched on characteristics (industry, headcount,
  geography, breach size) — methodology is consistent year over year, so within-IBM trend
  comparison is legitimate, but it is a matched-sample series, not a fixed panel.
  Figure 3 label "Services" = professional services per the report's industry definitions.
  "Industrial" covers chemical, engineering, and manufacturing.
  "Energy" covers oil & gas, utilities, and alternative energy producers.

trend_note: >
  Global average fell to 4.44 from 4.88 in 2024 (-9%), the first decline in five years,
  driven by faster detection/containment aided by AI and automation. The US bucked the
  trend at a record 10.22 (up 9% from 9.36). Healthcare remained the costliest industry
  for the 14th consecutive year despite a sharp drop (7.42 from 9.77, -24%). Detection
  and escalation costs fell ~10% to USD 1.47M. 50% of breaches were now identified by
  internal security teams (up from 42% in 2024). Trend is computed at runtime against
  the prior IBM edition file (see sibling-file note at the end).

global_average:
  "2025":
    value: 4.44
    basis: avg
  "2024":
    value: 4.88
    basis: avg

