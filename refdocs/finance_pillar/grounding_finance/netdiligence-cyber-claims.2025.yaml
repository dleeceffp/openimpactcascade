# =============================================================================
# SIBLING-FILE NOTES
# =============================================================================
#
# Trend partner:
#   netdiligence-cyber-claims.2024.yaml
#     comparable_series: "netdiligence-cyber-claims"
#     overall_averages.sme.incident_cost: 205K (five-year 2019-2023)
#
# Pairing guidance:
#   - IBM Cost of a Data Breach (ibm-cost-by-industry.2025.yaml): use for INDUSTRY-level
#     magnitude grounding where org is mid-large. IBM figures are MUCH higher than NetDiligence
#     because IBM captures mid-size+ breaches only (2,960–113,620 records).
#   - NetDiligence: use for SME magnitude grounding; revenue-band selection is critical.
#     Nano/Micro bands are most representative for OIC's typical assessed organizations.
#   - Never blend IBM and NetDiligence averages. Select one as primary, note the other.
#
# OIC headcount-to-revenue band mapping (approximate):
#   OIC band  1–50    → nano   (<$50M)
#   OIC band  51–250  → nano / micro boundary
#   OIC band  251–500 → micro  ($50M–$300M)
#   OIC band  501–2500→ micro / small boundary
#   OIC band  2501–5000 → small ($300M–$2B)
#   OIC band  5000+   → small / mid boundary
