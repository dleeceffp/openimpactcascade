# =============================================================================
# OIC financial pillar
# NetDiligence Cyber Claims Study 2025 (SME + large-company claims series)
# Extracted by AI from source PDF using pdfplumber. Tables 3–7, Figures 4, 40–45.
# =============================================================================

publisher:          "NetDiligence Cyber Claims Study"
edition:            "2025"
published:          "2025"
citation_url:       "https://netdiligence.com/cyber-claims-study"
evidence_type:      claims                    # actual paid cyber insurance claims; NOT survey, NOT benchmark
unit:               "USD, average total incident cost per claim"
banding:            revenue                   # NetDiligence segments by annual revenue band (see bands below)
comparable_series:  "netdiligence-cyber-claims"
review_status:      "[AI-EXTRACTED]"          # extracted by AI from source PDF — verify figures against original

# Why banding is `revenue`:
#   NetDiligence segments claims by 7 annual-revenue bands. OIC uses headcount bands.
#   Band-mapping guidance: Nano (<$50M) → OIC 1–50 / 51–250; Micro ($50M–$300M) → OIC 251–500 / 501–2500;
#   Small ($300M–$2B) → OIC 2501–5000 / 5000+. Mid/Large/Mega map to large-enterprise only.
#   Treat Nano + Micro as the primary SME grounding bands for most OIC assessments.
#   Do NOT blend SME and large-company averages; the 10x–1000x magnitude difference makes
#   blending misleading. Select the band that best matches the assessed organization's revenue.

# Revenue band definitions (from report page 54 / Table 3):
#   nano:   annual revenue < $50M          (41% of claims; 12% of total cost)
#   micro:  annual revenue $50M–$300M      (19% of claims; 14% of total cost)
#   small:  annual revenue $300M–$2B       ( 6% of claims; 21% of total cost)
#   mid:    annual revenue $2B–$10B        ( 2% of claims; 20% of total cost)     [large company]
#   large:  annual revenue $10B–$100B      (<1% of claims; 27% of total cost)     [large company]
#   mega:   annual revenue > $100B         (<1% of claims;  3% of total cost)     [large company]
#   unknown: 31% of claims; $47K avg
#
# SME threshold: < $2B annual revenue (nano + micro + small)
# Large company: >= $2B annual revenue (mid + large + mega)

methodology_note: >
  NetDiligence fifteenth annual study. Based on 10,402 cyber insurance claims from incidents
  occurring 2020–2024 (five-year pooled window). 4,108 new/updated claims collected in 2025
  from incidents occurring 2022–2024; 1,691 claims from 2024 incidents.
  98% of claims by count from SMEs (<$2B annual revenue); 2% from large companies (>=$2B).
  SMEs account for 49% of total incident cost; large companies 51%.
  Incident cost = aggregate total of all cost types including SIR (self-insured retention).
  Crisis services cost = breach coach, forensics, notification, credit/ID monitoring, PR.
  "Recordless" events included — report uses "incident" not "breach."
  Cost figures are AVERAGES (not medians); heavily influenced by outlier claims.
  Largest SME claim: >$100M (manufacturing, ransomware, 2022). Largest large-company claim: >$500M.
  Five-year average incident cost at SMEs: $264K (up ~29% from $205K in prior edition).
  Five-year average incident cost at large companies: $10.3M (down 19% from $12.7M).
  Dataset covers 18 business sectors, 7 revenue bands, 25 causes of loss, 13 data types.
  Payout covered 32% of total incident cost overall; 69% at SMEs, 27% at large companies.
  All cost figures in USD. Data source: participating cyber insurers (see report page 50).

trend_note: >
  SME average incident cost rose to $264K (five-year) from $205K in last year's study (+29%).
  Large-company average fell to $10.3M from $12.7M (-19%). Business interruption and recovery
  costs continue rising at SMEs. Healthcare incident costs appear to have stabilised.
  Manufacturing losses remain at five-year lows. Ransomware and BEC together account for
  ~50% of SME claims ≥$1K (five-year), rising to ~55% in 2024 specifically.
  Ransoms reached new record levels. ~15–20% of ransomware victims opted to pay the demand.

