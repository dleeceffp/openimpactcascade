overall_averages:
  sme:
    incident_cost:      { value: 175000,   basis: avg, n: 7,768 }   # Figure 2; five-year 2018-2022
    crisis_services:    { value: 103000,    basis: avg, n: 4,824 }   # Figure 2; where crisis svcs > 0
  large_company:
    incident_cost:      { value: 13800000, basis: avg, n: 136  }   # Figure 2
    crisis_services:    { value: 2100000,  basis: avg, n: 81   }   # Figure 2

