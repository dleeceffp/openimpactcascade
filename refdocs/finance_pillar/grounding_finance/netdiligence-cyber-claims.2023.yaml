# =============================================================================
# OIC financial pillar
# NetDiligence Cyber Claims Study 2024 (SME + large-company claims series)
# Transcribed from the uploaded 2024 report. Tables 3, 5, 6, 7; Figures 2, 32.
# =============================================================================

publisher:          "NetDiligence Cyber Claims Study"
edition:            "2023"
published:          "2023-09"
citation_url:       "https://netdiligence.com/cyber-claims-study"
evidence_type:      claims                    # actual cyber insurance claims; NOT survey, NOT benchmark
unit:               "USD, average total incident cost per claim"
banding:            revenue                   # NetDiligence segments by annual revenue band (see bands below)
comparable_series:  "netdiligence-cyber-claims"
review_status:      "reviewed"                # transcribed from source PDF tables — verify before production use

# Why banding is `revenue`:
#   NetDiligence segments claims by 7 annual-revenue bands. OIC uses headcount bands.
#   OIC-AUTHORED band-mapping guidance (interpretation, NOT from NetDiligence; revenue->headcount is loose):
#     Nano (<$50M) -> OIC 1–50 / 51–250; Micro ($50M–$300M) -> OIC 251–500 / 501–2500;
#     Small ($300M–$2B) -> OIC 2501–5000 / 5000+. Mid/Large/Mega map to large-enterprise only.
#   Treat Nano + Micro as the primary SME grounding bands for most OIC assessments.
#   Do NOT blend SME and large-company averages (10x–1000x magnitude difference). Select the
#   band that best matches the assessed organization's revenue.

# Revenue band definitions (from report page 51 / Table 3):
#   nano:   annual revenue < $50M          (Table 3: 14% of total cost)
#   micro:  annual revenue $50M–$300M      (13% of total cost)
#   small:  annual revenue $300M–$2B       (19% of total cost)
#   mid:    annual revenue $2B–$10B        (14% of total cost)     [large company]
#   large:  annual revenue $10B–$100B      (36% of total cost)     [large company]
#   mega:   annual revenue > $100B         ( 2% of total cost)     [large company]
#   unknown: 3% of total cost; $50K avg (n=2,401; folded into SME group for headline figures)
#
# SME threshold: < $2B annual revenue (nano + micro + small)
# Large company: >= $2B annual revenue (mid + large + mega)

methodology_note: >
  NetDiligence fourteenth annual study. Based on 9,028 cyber insurance claims from incidents
  occurring 2018–2022 (five-year pooled window). 4,945 new/updated claims collected in 2023
  from incidents occurring 2020–2022; 801 claims from 2022 incidents.
  98% of claims by count from SMEs (<$2B annual revenue, avg size $93M); 2% from large companies
  (>=$2B, avg size $13.3B). SMEs account for 48% of total incident cost; large companies 52%.
  Cost figures are AVERAGES (not medians); heavily influenced by outlier claims.
  Convenience/nonstatistical sample — authors state no significance can be claimed; figures are
  LOWER BOUNDS (exclude in-house investigation, customer defection, opportunity loss).
  Payout covered 47% of total incident cost overall; 81% at SMEs, 24% at large companies.
  Dataset covers 19 business sectors, 7 revenue bands, 25 causes of loss, 14 data types.
  All cost figures in USD. Data source: participating cyber insurers (see report page 49).

trend_note: >
  From the 2023 report's own narrative (within-edition observations, not cross-edition deltas):
  BEC incident costs rose; general "hacker" incident costs fell; wire-transfer-fraud costs have
  declined steadily since 2020; healthcare SME costs continued to decrease; manufacturing SME
  costs dropped to a five-year low; financial services saw a sharp increase. Five-year average
  incident cost at SMEs: $205K. Cross-edition trend is computed at runtime against the sibling
  edition (netdiligence-cyber-claims.2025.yaml) on comparable_series + publisher.

# =============================================================================
# OVERALL AVERAGES (all sectors combined) — Figure 2
