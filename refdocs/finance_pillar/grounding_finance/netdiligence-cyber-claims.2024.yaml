    micro:  { value: 317000,   basis: avg, n: 1584, unit: "USD avg incident cost", note: "max 10.4M; min 1K" }
    small:  { value: 1800000,  basis: avg, n: 405,  unit: "USD avg incident cost", note: "max 108.0M; min 1K" }
    mid:    { value: 4700000,  basis: avg, n: 112,  unit: "USD avg incident cost", note: "max 111.0M; min 1K" }
    large:  { value: 33300000, basis: avg, n: 42,   unit: "USD avg incident cost", note: "max 503.5M; min 10K" }
    mega:   { value: 26100000, basis: avg, n: 3,    unit: "USD avg incident cost", note: "max 55.0M; min 10.6M" }

