# SIBLING-FILE NOTES
# =============================================================================
#
# Trend partner:
#   netdiligence-cyber-claims.2025.yaml
#     comparable_series: "netdiligence-cyber-claims"
#     overall_averages.sme.incident_cost: 264K (five-year 2020-2024, +29% vs this edition's 205K)
#     overall_averages.large_company.incident_cost: 10.3M (-19% vs this edition's 12.7M)
#
# Pairing guidance:
#   - IBM Cost of a Data Breach (ibm-cost-by-industry.2025.yaml): INDUSTRY-level magnitude,
#     all-sizes incurred-loss; figures run MUCH higher (mid-size+ breaches, 2,960–113,620 records).
#   - NetDiligence: SME magnitude grounding; revenue-band selection is critical. Nano/Micro bands
#     are most representative for OIC's typical assessed organizations.
#   - Never blend IBM and NetDiligence averages. Select one as primary, note the other.
#
