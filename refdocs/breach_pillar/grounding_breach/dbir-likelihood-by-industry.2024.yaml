    breaches_large:  6
    top_patterns:   "System Intrusion, Social Engineering, Basic Web Application Attacks"
    threat_actors:  "External dominant, Internal minority (breaches)"
    actor_motives:  "Financial majority, Espionage elevated (breaches)"
    data_compromised: "Internal, Secrets, Other (breaches)"
    notable: >
      Espionage motive elevated vs. most sectors due to critical infrastructure status.
