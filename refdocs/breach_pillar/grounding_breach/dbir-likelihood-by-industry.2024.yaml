  construction:                      # NAICS 23
    incidents:      249
    breaches:       220
    incidents_small: 17
    incidents_large: 6
    top_patterns:   "System Intrusion, Social Engineering, Basic Web Application Attacks"
    threat_actors:  "External dominant (breaches)"
    actor_motives:  "Financial majority, Espionage minority (breaches)"
    data_compromised: "Internal, Credentials, Other (breaches)"
    notable: >
      High breach-to-incident ratio (88%). Project IP, subcontractor data, and payment
      information are targets. BEC targeting high-value construction payments is a known risk.

  entertainment:                     # NAICS 71
    incidents:      447
    breaches:       306
    incidents_small: 16
    incidents_large: 2
    breaches_small:  10
    breaches_large:  1
    top_patterns:   "System Intrusion, Social Engineering, Miscellaneous Errors"
    threat_actors:  "External majority, Internal minority (breaches)"
    actor_motives:  "Financial dominant, Espionage minor (breaches)"
    data_compromised: "Personal, Other, Internal (breaches)"
    notable: >
      SMB-dominated in incident count. High breach-to-incident ratio. Personal subscriber/
      fan data is the primary target. Internal actor share notable for creative/media orgs.

  real_estate:                       # NAICS 53
    incidents:      432
    breaches:       399
    incidents_small: 35
    incidents_large: 5
    breaches_small:  29
    breaches_large:  2
    top_patterns:   "System Intrusion, Social Engineering, Basic Web Application Attacks"
    threat_actors:  "External dominant (breaches)"
    actor_motives:  "Financial dominant (breaches)"
    data_compromised: "Personal, Credentials (breaches)"
    notable: >
      Very high breach-to-incident ratio (92%). BEC (wire/payment fraud via email
      compromise) is a particular risk given high-value transactions processed by email.

  other_services:                    # NAICS 81 (repair, personal services, religious orgs, etc.)
    incidents:      462
    breaches:       417
    incidents_small: 13
